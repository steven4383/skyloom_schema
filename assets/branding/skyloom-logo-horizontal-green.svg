<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 260"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Skyloom woven-thread logo</title>
  <desc id="description">
    Four horizontal green threads weave together into a flowing textile mark.
  </desc>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer dark thread. -->
    <path
      d="M48 190h100c80 0 105-120 205-120s125 120 215 120h104"
      stroke="#0B3D2E"
      stroke-width="26"
    />
    <path
      d="M48 190h100c80 0 105-120 205-120s125 120 215 120h104"
      stroke="#FFFFFF"
      stroke-opacity="0.11"
      stroke-width="1.5"
    />

    <!-- Outer bright thread. -->
    <path
      d="M48 70h100c80 0 105 120 205 120s125-120 215-120h104"
      stroke="#32D583"
      stroke-width="26"
    />
    <path
      d="M48 70h100c80 0 105 120 205 120s125-120 215-120h104"
      stroke="#FFFFFF"
      stroke-opacity="0.16"
      stroke-width="1.5"
    />

    <!-- Inner dark-green thread. -->
    <path
      d="M48 150h126c76 0 99-40 179-40s109 40 191 40h128"
      stroke="#146B4A"
      stroke-width="22"
    />
    <path
      d="M48 150h126c76 0 99-40 179-40s109 40 191 40h128"
      stroke="#FFFFFF"
      stroke-opacity="0.12"
      stroke-width="1.5"
    />

    <!-- Inner light-green thread completes the weave. -->
    <path
      d="M48 110h126c76 0 99 40 179 40s109-40 191-40h128"
      stroke="#65E6AB"
      stroke-width="22"
    />
    <path
      d="M48 110h126c76 0 99 40 179 40s109-40 191-40h128"
      stroke="#FFFFFF"
      stroke-opacity="0.18"
      stroke-width="1.5"
    />
  </g>
</svg>
